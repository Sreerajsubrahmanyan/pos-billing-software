services:
  - type: web
    name: loom-lane-pos-api
    runtime: ruby
    plan: free
    rootDir: backend
    buildCommand: bundle install && bin/rails db:prepare && bin/rails db:seed
    startCommand: bin/rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loom-lane-pos-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: FRONTEND_ORIGINS
        value: https://loom-lane-pos-ui.onrender.com

  - type: web
    name: loom-lane-pos-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://loom-lane-pos-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: loom-lane-pos-db
    plan: free
